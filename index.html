<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PER 簡易診断UI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>PER 簡易診断UI</h1>
      <p class="lead">npm不要で動作する静的版です。60干支CSVを読み込んで2人の干支関係を簡易表示します。</p>

      <section class="card">
        <h2>診断入力</h2>
        <div class="form-grid">
          <label>Person A
            <select id="personA"></select>
          </label>
          <label>Person B
            <select id="personB"></select>
          </label>
        </div>
        <button id="diagnoseBtn">診断する</button>
      </section>

      <section class="card" id="resultCard">
        <h2>診断結果</h2>
        <div id="result">データ読み込み後に「診断する」を押してください。</div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
